<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WasmBridge Emscripten - RUNNING</title>
<style>
body { font-family: sans-serif; max-width: 760px; margin: 2em auto; padding: 0 1em; }
pre { border: 1px solid #aaa; padding: 1em; white-space: pre-wrap; }
</style>
<script src="../../Runtime/wasmbridge.js"></script>
</head>
<body>
<h1>WasmBridge: Emscripten standalone module</h1>
<p>This module is built by Emscripten and loaded without Emscripten JavaScript glue.</p>
<button type="button" id="run">Run test</button>
<pre id="results">Press Run test.</pre>
<script>
(function () {
    "use strict";
    var results = document.getElementById("results");
    function run() {
        results.textContent = "Loading...";
        WasmBridge.load({
            wasm: "add.wasm",
            exports: ["add"],
            preferWasm: true
        }).then(function (processor) {
            var answer = processor.add(20, 22);
            var pass = answer === 42 && processor.backend === "wasm";
            results.textContent = (pass ? "PASS" : "FAIL") + ": add(20,22) = " + answer +
                "\nBackend: " + processor.backend +
                "\nCompiler: Emscripten 6.0.10";
            document.title = (pass ? "PASS" : "FAIL") + " - WasmBridge Emscripten (" + processor.backend + ")";
        }).catch(function (error) {
            results.textContent = "FAIL: " + error.message;
            document.title = "FAIL - WasmBridge Emscripten - " + error.message.replace(/[\r\n]+/g, " ").slice(0, 160);
        });
    }
    document.getElementById("run").onclick = run;
    run();
}());
</script>
</body>
</html>
