<body><h1>WasmBridge native WebAssembly self-test</h1><p>Direct native-WASM acceptance test; no WasmBridge wrapper or JS fallback is used.</p><pre id="result">PENDING: loading modules...</pre>
<script>(function(){"use strict";var out=document.getElementById("result"),notes=[];
function ok(v,m){if(!v)throw new Error(m);}function same(a,b,m){ok(a.length===b.length,m+" length");for(var i=0;i<b.length;i++)if(a[i]!==b[i])throw new Error(m+" byte "+i);}function bytes(mem,p,n){var x=new Uint8Array(mem.buffer,p,n),r=[];for(var i=0;i<x.length;i++)r.push(x[i]);return r;}
function load(u){return fetch(u).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status+" for "+u);return r.arrayBuffer();}).then(function(b){return WebAssembly.instantiate(new Uint8Array(b),{});}).then(function(x){return x.instance||x;});}
function hello(){return load("../HelloWorld/add.wasm").then(function(i){ok(i.exports.add(20,22)===42,"HelloWorld add");notes.push("HelloWorld: PASS");});}
function emcc(){return load("../EmscriptenHelloWorld/add.wasm").then(function(i){ok(i.exports.add(123,-23)===100,"Emscripten add");notes.push("Emscripten standalone: PASS");});}
function rgba(){return load("../ImageProcessing/rgba.wasm").then(function(i){var a=i.exports,p=a.wb_rgba_buffer(),v=[1,2,3,4,20,40,80,160,255,128,0,33,9,10,11,12];new Uint8Array(a.memory.buffer).set(v,p);ok(a.wb_rgba_invert(2,2)===16,"RGBA call");same(bytes(a.memory,p,16),[254,253,252,4,235,215,175,160,0,127,255,33,246,245,244,12],"RGBA");notes.push("RGBA: PASS");});}
function buffers(){return load("../BufferArena/buffers.wasm").then(function(i){var a=i.exports,p=[],j,x,big,pages;ok(typeof a.wb_address_bits==="function"&&a.wb_address_bits()===32,"Firefox 52 fixture must be wasm32");for(j=0;j<300;j++){x=a.wb_alloc(8);ok(x>0,"allocation "+j);p.push(x);}ok(a.wb_active_count()===300,">128 live allocations");for(j=0;j<p.length;j++)ok(a.wb_free(p[j])===1,"free "+j);big=a.wb_alloc(40*1024*1024);if(!big){pages=Math.ceil((40*1024*1024+65536)/65536);a.memory.grow(pages);big=a.wb_alloc(40*1024*1024);}ok(big>0,"40 MiB allocation");ok(a.memory.buffer.byteLength>32*1024*1024,"memory grew beyond 32 MiB");new Uint8Array(a.memory.buffer,big,4).set([9,8,7,6]);same(bytes(a.memory,big,4),[9,8,7,6],"large allocation data");ok(a.wb_free(big)===1,"large free");ok(a.wb_active_count()===0,"allocator leak");notes.push("BufferArena wasm32, >128 handles and >32 MiB: PASS");});}
function corrupt(){var b=new Uint8Array([0,97,115,109,1,0,0,0,255]);return WebAssembly.instantiate(b,{}).then(function(){throw new Error("corrupt module accepted");},function(){notes.push("Malformed WASM rejection: PASS");});}
if(typeof WebAssembly==="undefined"||typeof WebAssembly.instantiate!=="function"){out.textContent="FAIL: native WebAssembly unavailable";document.title="FAIL - WasmBridge native WASM self-test";return;}
hello().then(emcc).then(rgba).then(buffers).then(corrupt).then(function(){out.textContent="PASS\n"+notes.join("\n")+"\nBrowser: "+navigator.userAgent;document.title="PASS - WasmBridge native WASM self-test";},function(e){out.textContent="FAIL: "+e.message+"\n"+notes.join("\n");document.title="FAIL - WasmBridge native WASM self-test";});}());</script></body></html>
